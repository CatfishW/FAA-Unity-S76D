# Canonical X-Plane 12 dashboard endpoint.
# The dashboard is static; telemetry is carried over the existing reverse SSH
# tunnel from host 4090 to tang-server:12678.

server {
    listen 80;
    listen [::]:80;
    server_name faa.subtokenai.com;
    root /www/wwwroot/faa.agaii.org/xplane12;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Keep the shared 443 socket on HTTP/1.1.  The installed Nginx 1.24
    # HTTP/2 listener was rejected by Chromium clients before a response
    # body could be delivered; HTTP/1.1 retains keep-alive and streaming.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name faa.subtokenai.com;
    root /www/wwwroot/faa.agaii.org/xplane12;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/faa.subtokenai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faa.subtokenai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLfaa:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_buffer_size 4k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    # RFC 9113 forbids hop-by-hop response headers on HTTP/2 streams.  The
    # bridge is an HTTP/1.1 upstream, so strip any such headers before Nginx
    # serializes the response for Chrome and other HTTP/2 clients.
    proxy_hide_header Connection;
    proxy_hide_header Keep-Alive;
    proxy_hide_header Proxy-Connection;
    proxy_hide_header Proxy-Authenticate;
    proxy_hide_header Proxy-Authorization;
    proxy_hide_header TE;
    proxy_hide_header Trailer;
    proxy_hide_header Transfer-Encoding;
    proxy_hide_header Upgrade;

    # The frontend polls these endpoints and receives the live bridge data.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:12678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:12678/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:12678/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Preserve the original /xplane12/ path as a compatibility alias.
    location ^~ /xplane12/api/ {
        proxy_pass http://127.0.0.1:12678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /xplane12/v1/ {
        proxy_pass http://127.0.0.1:12678/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /xplane12/health {
        proxy_pass http://127.0.0.1:12678/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location = /faa {
        return 308 https://faa.subtokenai.com/xplane12/;
    }

    location = /faa/ {
        return 308 https://faa.subtokenai.com/xplane12/;
    }

    # Keep the explicit path usable for bookmarked clients while serving the
    # same files as the canonical root.  Avoid a rewrite so try_files checks
    # the actual /www/wwwroot/faa.agaii.org/xplane12 tree.
    location = /xplane12 {
        return 308 /xplane12/;
    }

    location ^~ /xplane12/ {
        root /www/wwwroot/faa.agaii.org;
        try_files $uri $uri/ /xplane12/index.html;
    }

    # Make the canonical hostname open the current sectional-chart cockpit.
    # The legacy root dashboard is no longer the public entry point.
    location = / {
        return 308 /xplane12/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
