# Compatibility route for the former https://api.agaii.org/faa endpoint.
# Keep this route live while faa.subtokenai.com is the canonical hostname.

server {
    listen 80;
    listen [::]:80;
    server_name api.agaii.org;
    include /www/server/panel/vhost/nginx/extension/api.agaii.org/*.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/api.agaii.org;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /faa {
        return 301 https://$host/faa/;
    }

    location ^~ /faa/ {
        return 301 https://$host$request_uri;
    }
}

server {
    # Match the shared listener policy used by faa.subtokenai.com.  This
    # Nginx build produces browser HTTP/2 protocol errors on this socket.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.agaii.org;
    include /www/server/panel/vhost/nginx/extension/api.agaii.org/*.conf;

    ssl_certificate /etc/letsencrypt/live/api.agaii.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agaii.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLapi:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_buffer_size 4k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    # RFC 9113 forbids hop-by-hop response headers on HTTP/2 streams.  Strip
    # any HTTP/1.1 bridge headers before the compatibility response is sent.
    proxy_hide_header Connection;
    proxy_hide_header Keep-Alive;
    proxy_hide_header Proxy-Connection;
    proxy_hide_header Proxy-Authenticate;
    proxy_hide_header Proxy-Authorization;
    proxy_hide_header TE;
    proxy_hide_header Trailer;
    proxy_hide_header Transfer-Encoding;
    proxy_hide_header Upgrade;

    location = /faa {
        return 308 https://faa.subtokenai.com/xplane12/;
    }

    location ^~ /faa/api/ {
        proxy_pass http://127.0.0.1:12678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /faa/health {
        proxy_pass http://127.0.0.1:12678/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location ^~ /faa/v1/ {
        proxy_pass http://127.0.0.1:12678/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /faa/ {
        return 308 https://faa.subtokenai.com/xplane12/;
    }

    location ^~ /faa/ {
        # Preserve deep legacy asset links while moving the document root to
        # the canonical /xplane12 tree.
        rewrite ^/faa/(.*)$ /xplane12/$1 break;
        root /www/wwwroot/faa.agaii.org;
        try_files $uri $uri/ /xplane12/index.html;
    }
}
